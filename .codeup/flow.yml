# =============================================================================
# 云效 Flow 流水线 — DJI Cloud API SDK（Codeup 侧：构建 + 制品仓库 + 代码同步）
# =============================================================================
# 用途：当 Codeup 仓库收到版本号格式的 tag 推送时，自动：
#   1. Maven 多模块构建 + 发布到云效 Maven 制品仓库
#   2. 镜像推送代码（含 tags）到 GitHub 和 Gitee
#
# 后续动作（由各平台 CI 独立完成，不在本流水线内）：
#   - GitHub Actions 收到 tag 推送后打包并创建 GitHub Release
#   - Gitee Go 收到 tag 推送后打包并创建 Gitee Release
#
# 多模块结构：
#   - dji-cloud-api-sdk（协议定义层）
#   - dji-cloud-api-sdk-wayline（航线工具层，依赖 sdk）
#
# 使用方式：
#   1. 进入云效 Flow → 新建流水线 → 选择「YAML 化编排」→ 空模板
#   2. 将本文件内容粘贴到流水线「流程配置」中
#   3. 在「变量和缓存 → 变量」中添加以下变量：
#      - GITHUB_TOKEN: GitHub Personal Access Token（需 repo 权限，用于镜像推送）
#      - GITEE_TOKEN:  Gitee 私人令牌（需 projects 权限，用于镜像推送）
#   4. 在「代码源」中配置 Codeup 服务连接，将 <service-connection-id> 替换为实际 ID
#   5. 保存并运行
#
# 触发条件：推送版本号格式的 tag（如 1.16.1.0）
# =============================================================================

# ==================== 流水线源 ====================
sources:
  codeup_repo:
    type: codeup
    name: DJI Cloud API SDK
    endpoint: https://codeup.aliyun.com/cdmi/cdmi-apps-all/dji-cloud-api-sdk.git
    branch: main
    triggerEvents:
      - tagPush                    # Tag 创建时触发
    certificate:
      type: serviceConnection
      serviceConnection: <service-connection-id>  # 在 Flow 服务连接管理中创建后填入

# ==================== 流水线阶段 ====================
stages:
  # -------------------- 阶段 1：构建 + 发布到云效制品仓库 --------------------
  build_stage:
    name: 构建并发布到制品仓库
    jobs:
      build_job:
        name: Maven 多模块构建 + deploy
        runsOn: public/cn-beijing
        steps:
          build:
            name: Maven 构建 + 发布到云效 Maven 制品仓库
            step: JavaBuild
            with:
              jdkVersion: '21'
              mavenVersion: '3.9.3'
              run: |
                # 提取 tag：环境变量 → git describe → git tag 最新
                TAG="${CI_COMMIT_REF_NAME:-}"
                if [ -z "${TAG}" ] || [ "${TAG}" = "main" ]; then
                  TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                fi
                if [ -z "${TAG}" ]; then
                  TAG=$(git tag --sort=-creatordate 2>/dev/null | head -1 || echo "")
                fi
                echo "构建版本: ${TAG}"

                # 多模块版本号统一更新（父 pom + sdk + sdk-wayline）
                mvn versions:set -DnewVersion="${TAG}" -DprocessAllModules=true -DgenerateBackupPoms=false

                # 构建 + 发布到云效 Maven 制品仓库
                mvn -B clean deploy -DskipTests

                # 列出构建产物
                echo "=== 构建产物 ==="
                ls -lh sdk/target/dji-cloud-api-sdk-${TAG}.jar
                ls -lh sdk-wayline/target/dji-cloud-api-sdk-wayline-${TAG}.jar
                echo "已发布到云效 Maven 制品仓库"

  # -------------------- 阶段 2：镜像推送代码到 GitHub / Gitee --------------------
  sync_stage:
    name: 同步代码到 GitHub / Gitee
    dependsOn: build_stage
    jobs:
      sync_job:
        name: 镜像推送代码（含 tags）
        runsOn: public/cn-beijing
        steps:
          # --- 2.1 推送到 GitHub ---
          push_github:
            name: 推送到 GitHub
            step: Command
            with:
              run: |
                git config --global user.name "yunxiao-flow"
                git config --global user.email "yunxiao-flow@aliyun.com"

                git remote add github "https://oauth2:${GITHUB_TOKEN}@github.com/cdmiltd/dji-cloud-api-sdk.git"

                # 重试推送（国内访问 GitHub 不稳定）
                MAX_RETRIES=3
                RETRY_DELAY=15
                for i in $(seq 1 ${MAX_RETRIES}); do
                  if git push github refs/remotes/origin/*:refs/heads/* --force && \
                     git push github --tags --force; then
                    echo "GitHub 推送成功（分支 + tags）"
                    break
                  fi
                  if [ ${i} -lt ${MAX_RETRIES} ]; then
                    echo "第 ${i} 次推送失败，${RETRY_DELAY} 秒后重试..."
                    sleep ${RETRY_DELAY}
                  else
                    echo "::error::GitHub 推送失败，已重试 ${MAX_RETRIES} 次"
                    git remote remove github
                    exit 1
                  fi
                done

                git remote remove github
                echo "GitHub 推送完成，GitHub Actions 将自动触发打包与 Release"

          # --- 2.2 推送到 Gitee ---
          push_gitee:
            name: 推送到 Gitee
            step: Command
            with:
              run: |
                git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/alpeai/dji-cloud-api-sdk.git"
                git push gitee refs/remotes/origin/*:refs/heads/* --force
                git push gitee --tags --force
                git remote remove gitee
                echo "Gitee 推送完成，Gitee Go 将自动触发打包与 Release"
