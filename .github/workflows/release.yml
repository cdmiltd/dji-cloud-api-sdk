name: Release

# 触发条件：推送 v* 格式的 tag 时自动执行
# 发布流程：tag 推送到 GitHub → 镜像到 Gitee → 打包源码 → 双平台 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 GitHub Release 所需权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ==================== 1. 检出代码 ====================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于镜像推送

      # ==================== 2. 镜像推送到 Gitee ====================
      - name: Push to Gitee mirror
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 使用 token 认证推送到 Gitee（token 存储在 GitHub Secrets 中，日志自动脱敏）
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/alpeai/dji-cloud-api-sdk.git"
          git push gitee refs/remotes/origin/*:refs/heads/* --force
          git push gitee "${GITHUB_REF}" --force
          git remote remove gitee  # 清理 remote 配置，避免 token 残留

      # ==================== 3. 打包源码 ====================
      # 仅包含 src/、docs/ 目录和根目录文件（pom.xml、README.md、LICENSE）
      - name: Package source
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_DIR="dji-cloud-api-sdk-${TAG}"
          mkdir -p "${PKG_DIR}"
          # 复制目录
          cp -r src docs "${PKG_DIR}/"
          # 复制根目录文件
          cp pom.xml README.md LICENSE "${PKG_DIR}/"
          # 打包 zip 和 tar.gz
          zip -r "dji-cloud-api-sdk-${TAG}-src.zip" "${PKG_DIR}"
          tar czf "dji-cloud-api-sdk-${TAG}-src.tar.gz" "${PKG_DIR}"
          # 输出文件信息
          echo "## 打包结果" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| 文件 | 大小 |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| \`dji-cloud-api-sdk-${TAG}-src.zip\` | $(du -h "dji-cloud-api-sdk-${TAG}-src.zip" | cut -f1) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| \`dji-cloud-api-sdk-${TAG}-src.tar.gz\` | $(du -h "dji-cloud-api-sdk-${TAG}-src.tar.gz" | cut -f1) |" >> "${GITHUB_STEP_SUMMARY}"

      # ==================== 4. 创建 GitHub Release ====================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dji-cloud-api-sdk-*-src.zip
            dji-cloud-api-sdk-*-src.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

      # ==================== 5. 创建 Gitee Release ====================
      - name: Create Gitee Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 创建 Release
          RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/alpeai/dji-cloud-api-sdk/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${{ secrets.GITEE_TOKEN }}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": \"DJI Cloud API SDK ${TAG} 源码包\\n\\n包含 src/、docs/ 目录及根目录配置文件。\",
              \"target_commitish\": \"main\"
            }")
          RELEASE_ID=$(echo "${RESPONSE}" | jq -r '.id')
          if [ "${RELEASE_ID}" = "null" ] || [ -z "${RELEASE_ID}" ]; then
            echo "::error::创建 Gitee Release 失败: ${RESPONSE}"
            exit 1
          fi
          echo "Gitee Release ID: ${RELEASE_ID}"
          # 上传 zip 包
          curl -s -X POST \
            "https://gitee.com/api/v5/repos/alpeai/dji-cloud-api-sdk/releases/${RELEASE_ID}/attach_files" \
            -H "Content-Type: multipart/form-data" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@dji-cloud-api-sdk-${TAG}-src.zip" \
            | jq -r '.browser_download_url'
          # 上传 tar.gz 包
          curl -s -X POST \
            "https://gitee.com/api/v5/repos/alpeai/dji-cloud-api-sdk/releases/${RELEASE_ID}/attach_files" \
            -H "Content-Type: multipart/form-data" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@dji-cloud-api-sdk-${TAG}-src.tar.gz" \
            | jq -r '.browser_download_url'
          echo "## Gitee Release" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Release ${TAG} 已创建: https://gitee.com/alpeai/dji-cloud-api-sdk/releases/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
